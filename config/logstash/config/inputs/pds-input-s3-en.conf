input {
  # EN - Apache/IIS logs
  s3 {
    bucket => "${S3_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "en/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.http"
    }
    interval => 3600
    ecs_compatibility => "v8"
    id => "file_input_en"
  }

  # EN - CloudFront pds-main JSON logs (pds.mcp.nasa.gov)
  s3 {
    bucket => "${S3_CF_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "cloudfront/access/format=json/dist=pds-main/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.mcp.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.cloudfront.main"
      "[@metadata][cf_format]" => "json"
    }
    interval => 3600
    ecs_compatibility => "v8"
    id => "file_input_en_cf_main_json"
  }

  # EN - CloudFront pds-legacy JSON logs (pds.nasa.gov)
  s3 {
    bucket => "${S3_CF_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "cloudfront/access/format=json/dist=pds-legacy/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.cloudfront.legacy"
      "[@metadata][cf_format]" => "json"
    }
    interval => 3600
    ecs_compatibility => "v8"
    id => "file_input_en_cf_legacy_json"
  }

  # EN - CloudFront pds-legacy TSV/W3C logs (pds.nasa.gov)
  s3 {
    bucket => "${S3_CF_BUCKET_NAME}"
    region => "us-west-2"
    prefix => "cloudfront/access/format=tsv/dist=pds-legacy/"
    add_field => {
      "[organization][name]" => "en"
      "[url][domain]" => "pds.nasa.gov"
      "[url][scheme]" => "https"
      "[event][dataset]" => "en.cloudfront.legacy"
      "[@metadata][cf_format]" => "tsv"
    }
    interval => 3600
    ecs_compatibility => "v8"
    id => "file_input_en_cf_legacy_tsv"
  }
}
