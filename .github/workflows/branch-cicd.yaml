# 🏃‍♀️ Continuous Integration and Delivery: Branch Testing
# ======================================================

name: 🔁 Branch integration testing

# Driving Event
# -------------
#
# What event starts this workflow: a push to any branch other than main

on:
    push:
        branches:
            - '**'
            - '!main'

# What to Do
# ----------
#
# 1. Unit tests and linting via tox (no Logstash required; integration tests
#    self-skip when Logstash is absent).
# 2. Full Logstash integration tests via Docker (builds the multi-stage test
#    image and runs the test suite inside the container).

jobs:
    branch-testing:
        name: 🪵 Branch Testing
        runs-on: ubuntu-latest
        if: github.actor != 'pdsen-ci'

        steps:
            - name: 💳 Checkout
              uses: actions/checkout@v7
              with:
                  lfs: true
                  fetch-depth: 0
                  token: ${{secrets.ADMIN_GITHUB_TOKEN || github.token}}

            - name: Set up Python 3
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: 💵 Python Cache
              uses: actions/cache@v6
              with:
                  path: ~/.cache/pip
                  key: pds-${{runner.os}}-py-${{hashFiles('**/*.whl')}}
                  restore-keys: pds-${{runner.os}}-py-

            - name: 🔬 Unit Tests and Linting
              run: |
                  pip install --editable '.[dev]'
                  tox
              shell: bash

            - name: 🐳 Build Docker test image
              run: docker compose build test

            - name: 🧪 Logstash Integration Tests
              run: docker compose run --rm test
