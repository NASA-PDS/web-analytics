# Taskfile for web-analytics Terraform
# =====================================
#
# Covers two independent root modules that must be applied in order:
#   1. opensearch_managed/   - the OpenSearch domain (slow, ~15-20 min, run once at init)
#
# Prerequisites:
#   brew install go-task/tap/go-task
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_DEFAULT_REGION=...
#
# Typical first-time setup:
#   task opensearch:init VENUE=dev
#   task opensearch:plan VENUE=dev
#   task opensearch:deploy VENUE=dev        # ~15-20 min
#   Index templates are applied manually via curl from the Logstash EC2 — see README.

---

version: '3'

dotenv:
    - .env

tasks:

    # ------------------------------------------------------------------
    # AWS helper
    # ------------------------------------------------------------------

    aws:
        desc: "Verify AWS credentials are configured"
        silent: true
        cmds:
            - aws sts get-caller-identity --output json

    auth:
        desc: "Export SSO credentials as env vars for Terraform (re-run when session expires)"
        silent: true
        cmds:
            - |
              echo "Run the following in your shell to authenticate Terraform:"
              echo ""
              echo '  eval $(aws configure export-credentials --profile {{.AWS_PROFILE}} --format env)'
              echo ""
              echo "Credentials are valid for ~1 hour."

    # ------------------------------------------------------------------
    # S3: Log storage bucket
    # Can be run by Project-Power-User.
    # ------------------------------------------------------------------

    init:
        desc: "Initialize root module Terraform"
        deps: [aws]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    validate:
        desc: "Validate root module Terraform files"
        dir: '{{.USER_WORKING_DIR}}'
        cmds:
            - terraform validate -no-color

    s3:plan:
        desc: "Plan S3 bucket changes"
        deps: [init]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/{{.VENUE}}.tfvars
              -target=module.s3_bucket
              -target=aws_s3_bucket_lifecycle_configuration.lifecycle
              {{.CLI_ARGS}}

    s3:deploy:
        desc: "Deploy S3 bucket and lifecycle policy"
        aliases: [s3:apply]
        deps: [validate]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/{{.VENUE}}.tfvars
              -target=module.s3_bucket
              -target=aws_s3_bucket_lifecycle_configuration.lifecycle
              {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # EC2: Logstash instance
    # Requires iam:PassRole — must be run by a system administrator.
    # Run after opensearch:deploy (reads endpoint from SSM) and iam:deploy.
    # ------------------------------------------------------------------

    ec2:plan:
        desc: "Plan EC2 Logstash instance changes (requires admin — iam:PassRole)"
        deps: [init]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/{{.VENUE}}.tfvars
              -target=aws_launch_template.logstash
              -target=aws_instance.logstash
              -target=aws_ssm_parameter.logstash_instance_id
              {{.CLI_ARGS}}

    ec2:deploy:
        desc: "Deploy Logstash EC2 instance (requires admin — iam:PassRole)"
        aliases: [ec2:apply]
        deps: [validate]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/{{.VENUE}}.tfvars
              -target=aws_launch_template.logstash
              -target=aws_instance.logstash
              -target=aws_ssm_parameter.logstash_instance_id
              {{.CLI_ARGS}}

    ec2:destroy:
        desc: "Destroy Logstash EC2 instance"
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=tfvars/{{.VENUE}}.tfvars
              -target=aws_instance.logstash
              -target=aws_launch_template.logstash
              -target=aws_ssm_parameter.logstash_instance_id
              {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Full root module (S3 + EC2 together) — admin only
    # ------------------------------------------------------------------

    plan:
        desc: "Plan full root module (S3 + EC2) — requires admin for EC2"
        deps: [init]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    deploy:
        desc: "Deploy full root module (S3 + EC2) — requires admin for EC2"
        aliases: [apply]
        deps: [validate]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    destroy:
        desc: "Destroy root module resources"
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # IAM: EC2 policy + role attachment (requires admin/elevated role)
    # Run by a system administrator — Project-Power-User lacks iam:CreatePolicy.
    # Must be applied before Chunk 1 (EC2 needs the policy attached at launch).
    # ------------------------------------------------------------------

    iam:init:
        desc: "Initialize IAM policies module Terraform"
        deps: [aws]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    iam:validate:
        desc: "Validate IAM policies module Terraform files"
        dir: iam/policies
        cmds:
            - terraform validate -no-color

    iam:plan:
        desc: "Plan IAM policy changes (requires iam:CreatePolicy permissions)"
        deps: [iam:init]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    iam:deploy:
        desc: "Deploy IAM policies and role attachments (requires admin role)"
        aliases: [iam:apply]
        deps: [iam:validate]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    iam:destroy:
        desc: "Destroy IAM policies and role attachments"
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Chunk 2: OpenSearch domain
    # ------------------------------------------------------------------

    opensearch:init:
        desc: "Initialize OpenSearch domain Terraform"
        summary: >
            Initialize the opensearch_managed module, configuring the S3 backend for the given
            venue. Requires a backend-<venue>.hcl file in terraform/opensearch_managed/.
        deps: [aws]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    opensearch:validate:
        desc: "Validate OpenSearch domain Terraform files"
        dir: opensearch_managed
        cmds:
            - terraform validate -no-color

    opensearch:plan:
        desc: "Plan OpenSearch domain changes"
        deps: [opensearch:init]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:deploy:
        desc: "Deploy the OpenSearch domain (slow - allow ~15-20 min for domain creation)"
        summary: >
            Applies the opensearch_managed module. Domain creation takes ~15-20 minutes.
            After apply, the endpoint is published to SSM at
            /pds/web-analytics/opensearch_managed/opensearch_endpoint.
        deps: [opensearch:validate]
        aliases: [opensearch:apply]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:destroy:
        desc: "Destroy the OpenSearch domain"
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:show:
        desc: "Show OpenSearch domain Terraform state"
        deps: [opensearch:init]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform show

    opensearch:endpoint:
        desc: "Print the OpenSearch endpoint from SSM (requires deploy to have run)"
        silent: true
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - |
              aws ssm get-parameter \
                --name /pds/web-analytics/opensearch_managed/opensearch_endpoint \
                --query Parameter.Value \
                --output text

    # ------------------------------------------------------------------
    # Default
    # ------------------------------------------------------------------

    default:
        cmds:
            - task --list
        silent: true

...

