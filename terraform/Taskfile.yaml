# Taskfile for web-analytics Terraform
# =====================================
#
# Root modules and their deployment order:
#   1. opensearch_managed/   - OpenSearch domain (slow, ~15-20 min, run once at init)
#   2. iam/policies/         - IAM policy + role attachment (admin required)
#   3. . (root)              - S3 log bucket (Project-Power-User)
#   4. logstash/             - Logstash EC2 instance (admin required — iam:PassRole)
#
# Prerequisites:
#   brew install go-task/tap/go-task
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_DEFAULT_REGION=...

---

version: '3'

dotenv:
    - .env

tasks:

    # ------------------------------------------------------------------
    # AWS helper
    # ------------------------------------------------------------------

    aws:
        desc: "Verify AWS credentials are configured"
        silent: true
        cmds:
            - aws sts get-caller-identity --output json

    auth:
        desc: "Export SSO credentials as env vars for Terraform (re-run when session expires)"
        silent: true
        cmds:
            - |
              echo "Run the following in your shell to authenticate Terraform:"
              echo ""
              echo '  eval $(aws configure export-credentials --profile {{.AWS_PROFILE}} --format env)'
              echo ""
              echo "Credentials are valid for ~1 hour."

    # ------------------------------------------------------------------
    # S3: Log storage bucket
    # Can be run by Project-Power-User.
    # ------------------------------------------------------------------

    init:
        desc: "Initialize S3 root module Terraform"
        deps: [aws]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    validate:
        desc: "Validate S3 root module Terraform files"
        dir: '{{.USER_WORKING_DIR}}'
        cmds:
            - terraform validate -no-color

    s3:plan:
        desc: "Plan S3 bucket changes"
        deps: [init]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    s3:deploy:
        desc: "Deploy S3 bucket and lifecycle policy"
        aliases: ["s3:apply"]
        deps: [validate]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    s3:destroy:
        desc: "Destroy S3 bucket resources"
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    s3:refresh:
        desc: "Refresh S3 root module Terraform state"
        deps: [init]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -refresh-only -var-file=tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    s3:sync:
        desc: "Apply refresh-only to sync S3 state without changing infrastructure"
        deps: [init]
        dir: '{{.USER_WORKING_DIR}}'
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -refresh-only -var-file=tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # Logstash: EC2 instance
    # Requires iam:PassRole — must be run by a system administrator.
    # Run after opensearch:deploy (reads endpoint from SSM) and iam:deploy.
    # ------------------------------------------------------------------

    logstash:init:
        desc: "Initialize Logstash EC2 module Terraform (requires admin — iam:PassRole)"
        deps: [aws]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    logstash:validate:
        desc: "Validate Logstash EC2 module Terraform files"
        dir: logstash
        cmds:
            - terraform validate -no-color

    logstash:plan:
        desc: "Plan Logstash EC2 instance changes (requires admin — iam:PassRole)"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    logstash:deploy:
        desc: "Deploy Logstash EC2 instance (requires admin — iam:PassRole)"
        aliases: ["logstash:apply"]
        deps: ["logstash:validate"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    logstash:destroy:
        desc: "Destroy Logstash EC2 instance"
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    logstash:refresh:
        desc: "Refresh Logstash module Terraform state"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -refresh-only -var-file=../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    logstash:sync:
        desc: "Apply refresh-only to sync Logstash state without changing infrastructure"
        deps: ["logstash:init"]
        dir: logstash
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -refresh-only -var-file=../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # IAM: EC2 policy + role attachment (requires admin/elevated role)
    # Run by a system administrator — Project-Power-User lacks iam:CreatePolicy.
    # Must be applied before logstash:deploy (EC2 needs the policy attached at launch).
    # ------------------------------------------------------------------

    iam:init:
        desc: "Initialize IAM policies module Terraform"
        deps: [aws]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    iam:validate:
        desc: "Validate IAM policies module Terraform files"
        dir: iam/policies
        cmds:
            - terraform validate -no-color

    iam:plan:
        desc: "Plan IAM policy changes (requires iam:CreatePolicy permissions)"
        deps: ["iam:init"]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=../../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    iam:deploy:
        desc: "Deploy IAM policies and role attachments (requires admin role)"
        aliases: ["iam:apply"]
        deps: ["iam:validate"]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=../../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    iam:destroy:
        desc: "Destroy IAM policies and role attachments"
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=../../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    iam:refresh:
        desc: "Refresh IAM policies module Terraform state"
        deps: ["iam:init"]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -refresh-only -var-file=../../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    iam:sync:
        desc: "Apply refresh-only to sync IAM state without changing infrastructure"
        deps: ["iam:init"]
        dir: iam/policies
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -refresh-only -var-file=../../tfvars/common-{{.VENUE}}.tfvars -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    # ------------------------------------------------------------------
    # OpenSearch domain
    # ------------------------------------------------------------------

    opensearch:init:
        desc: "Initialize OpenSearch domain Terraform"
        summary: >
            Initialize the opensearch_managed module, configuring the S3 backend for the given
            venue. Requires a backend-<venue>.hcl file in terraform/opensearch_managed/.
        deps: [aws]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform init -no-color -reconfigure -backend-config=backend-{{.VENUE}}.hcl {{.CLI_ARGS}}

    opensearch:validate:
        desc: "Validate OpenSearch domain Terraform files"
        dir: opensearch_managed
        cmds:
            - terraform validate -no-color

    opensearch:plan:
        desc: "Plan OpenSearch domain changes"
        deps: ["opensearch:init"]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:deploy:
        desc: "Deploy the OpenSearch domain (slow - allow ~15-20 min for domain creation)"
        summary: >
            Applies the opensearch_managed module. Domain creation takes ~15-20 minutes.
            After apply, the endpoint is published to SSM at
            /pds/web-analytics/opensearch_managed/opensearch_endpoint.
        deps: ["opensearch:validate"]
        aliases: ["opensearch:apply"]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:destroy:
        desc: "Destroy the OpenSearch domain"
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -destroy -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:refresh:
        desc: "Refresh OpenSearch module Terraform state"
        deps: ["opensearch:init"]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform plan -refresh-only -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:sync:
        desc: "Apply refresh-only to sync OpenSearch state without changing infrastructure"
        deps: ["opensearch:init"]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform apply -refresh-only -var-file=tfvars/{{.VENUE}}.tfvars {{.CLI_ARGS}}

    opensearch:show:
        desc: "Show OpenSearch domain Terraform state"
        deps: ["opensearch:init"]
        dir: opensearch_managed
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - terraform show

    opensearch:endpoint:
        desc: "Print the OpenSearch endpoint from SSM (requires deploy to have run)"
        silent: true
        requires:
            vars:
                - name: VENUE
                  enum: [dev, test, prod]
        cmds:
            - |
              aws ssm get-parameter \
                --name /pds/observability/opensearch_managed/opensearch_endpoint \
                --query Parameter.Value \
                --output text

    # ------------------------------------------------------------------
    # Default
    # ------------------------------------------------------------------

    default:
        cmds:
            - task --list
        silent: true

...

# -*- mode: YAML; tab-width: 4 -*-
